services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/poker-hub.sqlite
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Persist SQLite database across restarts
      - poker-hub-data:/data

volumes:
  poker-hub-data:
