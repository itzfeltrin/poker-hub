name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            export PATH="/home/ubuntu/.nvm/versions/node/v22.22.0/bin:$PATH"
            export CI=1
            export TURBO_UI=plain
            cd /home/ubuntu/Dev/poker-hub
            git pull origin main
            bun install --frozen-lockfile
            # TURBO_UI=plain streams logs in GitHub UI; --no-daemon so turbo exits (avoids hang in SSH)
            bunx turbo run build --no-daemon
            cp -r frontend/dist backend/public
            sudo systemctl restart poker-hub
